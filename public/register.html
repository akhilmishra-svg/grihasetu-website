<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — GrihaSetu</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="/index.html" class="brand"><span class="mark">GS</span> GrihaSetu</a>
    <div></div>
    <div class="nav-cta"><a href="/login.html" class="btn btn-ghost btn-sm">Login instead</a></div>
  </div>
</nav>

<div class="wrap">
  <div class="card card-narrow">
    <h2>Create your account</h2>
    <p style="color:var(--ink-soft); margin-top:-8px; margin-bottom:22px; font-size:.9rem;">Whether you're a Customer or an Agent/Builder — both can register here.</p>

    <div id="formMsg"></div>

    <form id="registerForm">
      <div class="form-row">
        <label>I am a</label>
        <div class="radio-group">
          <label class="radio-pill active"><input type="radio" name="userType" value="customer" checked> Customer</label>
          <label class="radio-pill"><input type="radio" name="userType" value="agent"> Agent / Builder</label>
        </div>
      </div>
      <div class="form-row">
        <label for="name">Full Name</label>
        <input type="text" id="name" required placeholder="Your full name">
      </div>
      <div class="form-row">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" required placeholder="10-digit mobile number" pattern="[0-9]{10}">
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <div style="display:flex; gap:8px;">
          <input type="email" id="email" required placeholder="you@example.com" style="flex:1;">
          <button type="button" id="sendOtpBtn" class="btn btn-ghost btn-sm" style="white-space:nowrap;">Send OTP</button>
        </div>
      </div>
      <div class="form-row" id="otpRow" style="display:none;">
        <label for="otp">Enter OTP</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="otp" placeholder="6-digit code" maxlength="6" style="flex:1;">
          <button type="button" id="verifyOtpBtn" class="btn btn-ghost btn-sm">Verify</button>
        </div>
        <div class="hint" id="otpHint"></div>
      </div>
      <div class="form-row">
        <label for="city">City</label>
        <input type="text" id="city" placeholder="Your city">
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
      </div>
      <button type="submit" class="btn btn-brass btn-block" id="submitBtn" disabled>Create Account (verify email first)</button>
    </form>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
document.querySelectorAll('.radio-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.radio-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
  });
});

let emailVerified = false;

document.getElementById('sendOtpBtn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('sendOtpBtn');
  const msg = document.getElementById('formMsg');
  msg.innerHTML = '';
  if (!email || !email.includes('@')) {
    msg.innerHTML = `<div class="msg msg-error">Please enter a valid email first.</div>`;
    return;
  }
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    await api('/api/otp/send', 'POST', { email });
    document.getElementById('otpRow').style.display = 'block';
    document.getElementById('otpHint').textContent = `OTP sent to ${email}. It expires in 10 minutes.`;
    btn.textContent = 'Resend OTP';
  } catch (err) {
    msg.innerHTML = `<div class="msg msg-error">${err.message}</div>`;
    btn.textContent = 'Send OTP';
  }
  btn.disabled = false;
});

document.getElementById('verifyOtpBtn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const otp = document.getElementById('otp').value.trim();
  const hint = document.getElementById('otpHint');
  const btn = document.getElementById('verifyOtpBtn');
  btn.disabled = true; btn.textContent = 'Verifying...';
  try {
    await api('/api/otp/verify', 'POST', { email, otp });
    emailVerified = true;
    hint.innerHTML = `<span style="color:var(--green); font-weight:600;">Email verified ✓</span>`;
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Create Account';
    document.getElementById('email').disabled = true;
    document.getElementById('sendOtpBtn').disabled = true;
  } catch (err) {
    hint.innerHTML = `<span style="color:var(--rust);">${err.message}</span>`;
  }
  btn.disabled = false; btn.textContent = 'Verify';
});

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('formMsg');
  const btn = document.getElementById('submitBtn');
  msg.innerHTML = '';

  if (!emailVerified) {
    msg.innerHTML = `<div class="msg msg-error">Please verify your email with the OTP first.</div>`;
    return;
  }

  btn.disabled = true; btn.textContent = 'Creating...';

  const userType = document.querySelector('input[name=userType]:checked').value;
  try {
    const user = await api('/api/register', 'POST', {
      name: document.getElementById('name').value.trim(),
      mobile: document.getElementById('mobile').value.trim(),
      email: document.getElementById('email').value.trim(),
      city: document.getElementById('city').value.trim(),
      userType,
      password: document.getElementById('password').value,
    });
    setSession(user);
    window.location.href = userType === 'agent' ? '/dashboard.html' : '/dashboard.html';
  } catch (err) {
    msg.innerHTML = `<div class="msg msg-error">${err.message}</div>`;
    btn.disabled = false; btn.textContent = 'Create Account';
  }
});
</script>
</body>
</html>
